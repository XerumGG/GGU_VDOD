name: Build and Release

# Runs automatically whenever you push a version tag, e.g.:
#   git tag v0.2.10
#   git push origin v0.2.10
on:
  push:
    tags:
      - "v*"

# Needed so the workflow is allowed to create a GitHub Release
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow pytest
          choco install innosetup -y --no-progress

      - name: Download FFmpeg toolchain
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $zip -TimeoutSec 300
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\ffmpeg" -Force
          $bin = (Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Directory | Select-Object -First 1).FullName + "\bin"
          New-Item -ItemType Directory -Force -Path "ffmpeg" | Out-Null
          Copy-Item "$bin\ffmpeg.exe"  "ffmpeg\ffmpeg.exe"
          Copy-Item "$bin\ffprobe.exe" "ffmpeg\ffprobe.exe"
          Copy-Item "bin\qjs.exe"      "ffmpeg\qjs.exe"

      - name: Run regression tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
        run: python -m pytest tests -q

      - name: Build GGU_VDOD app folder
        run: >
          pyinstaller --noconsole --paths src
          --add-data "src/ggu_vdod/locales;ggu_vdod/locales"
          --collect-all PySide6 --name GGU_VDOD --clean -y app.py

      - name: Bundle FFmpeg into app folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist\GGU_VDOD\ffmpeg" | Out-Null
          Copy-Item "ffmpeg\ffmpeg.exe"  "dist\GGU_VDOD\ffmpeg\ffmpeg.exe"
          Copy-Item "ffmpeg\ffprobe.exe" "dist\GGU_VDOD\ffmpeg\ffprobe.exe"
          Copy-Item "ffmpeg\qjs.exe"     "dist\GGU_VDOD\ffmpeg\qjs.exe"

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content src/ggu_vdod/core/version.py |
            Select-String 'MAJOR = (\d+)|MINOR = (\d+)|PATCH = (\d+)' |
            ForEach-Object { $_.Matches } | ForEach-Object { $_.Value -replace '\D','' }) -join '.'
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build Windows installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" `
                  "/DSourceDir=${{ github.workspace }}\dist\GGU_VDOD" `
                  "${{ github.workspace }}\installer\GGU_VDOD.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assemble portable zip (fallback, no FFmpeg)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release | Out-Null
          Copy-Item dist\GGU_VDOD\GGU_VDOD.exe release\
          Copy-Item README.md release\
          Copy-Item LICENSE release\
          Compress-Archive -Path release\* -DestinationPath GGU_VDOD-windows-portable.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer_output/GGU_VDOD-setup-*.exe
            GGU_VDOD-windows-portable.zip
          generate_release_notes: true
          prerelease: false
