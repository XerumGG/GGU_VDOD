name: Build and Release

# Runs automatically whenever you push a version tag, e.g.:
#   git tag v1.0.0
#   git push origin v1.0.0
on:
  push:
    tags:
      - "v*"

# Needed so the workflow is allowed to create a GitHub Release
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build GGU_VDOD.exe
        run: pyinstaller --onefile --noconsole --name GGU_VDOD app.py

      - name: Assemble release package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release | Out-Null
          Copy-Item dist\GGU_VDOD.exe release\
          Copy-Item README.md release\
          Copy-Item LICENSE.txt release\
          # ffmpeg is intentionally NOT bundled here - see README for why.
          # Users add their own ffmpeg build next to the exe (or install it system-wide).
          Compress-Archive -Path release\* -DestinationPath GGU_VDOD-windows.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: GGU_VDOD-windows.zip
          generate_release_notes: true
          # Flip this to true while you're still testing the pipeline itself
          prerelease: false
