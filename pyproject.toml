[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ggu-vdod"
version = "0.2.0a1"
description = "Windows desktop media downloader and local converter"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "yt-dlp==2026.7.4",
  "Pillow==12.3.0",
  "ttkbootstrap==2.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
